[pytest]
# Django integration. pytest-django needs the settings module up front; without
# it, importing anything from races/ fails before a test can run.
DJANGO_SETTINGS_MODULE = config.settings

# Both suites live outside a single app: tests/ holds the scoring engine's
# tests, races/ the Django ones.
testpaths = tests races

python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
