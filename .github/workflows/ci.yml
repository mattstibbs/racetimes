name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the sites run (render.yaml). 3.14 is tested too, so we
        # know when the next step is safe (slice 20).
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt itself.
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        # CLAUDE.md's definition of done includes "migrations created".
        run: python manage.py makemigrations --check --dry-run

  lint:
    # Ruff, configured in pyproject.toml (slice 17): the linter, and the
    # formatter in check mode, which fails if any file isn't formatted.
    name: ruff lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        # Only Ruff, at the version requirements-dev.txt pins.
        run: python -m pip install --disable-pip-version-check "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  deploy-settings:
    # Django's deployment checklist, against the production settings (slice 11
    # part 4). --fail-level WARNING matters: without it the check reports its
    # warnings and still passes. The secret key is a throwaway for this job.
    name: production settings pass the deploy check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: manage.py check --deploy
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuvwxyz
        run: python manage.py check --deploy --fail-level WARNING

  engine-on-3-11:
    # The site runs on 3.13, but sailscoring/README.md promises the scoring engine
    # works on Python 3.11 or later, so it can be copied into other projects.
    # Its tests (tests/) run here on 3.11 to keep that promise (slice 20).
    name: scoring engine tests (python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the engine's tests
        run: python -m pytest tests

  vendorable:
    # The sailscoring package promises to be standard-library only, so that anyone can
    # copy it into another project. tests/test_package_purity.py checks that by
    # scanning imports; this checks it the other way round, by importing the
    # package on a machine where nothing has been installed at all.
    name: sailscoring imports with nothing installed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The oldest version sailscoring/README.md promises.
          python-version: "3.11"

      - name: Import sailscoring with no dependencies present
        run: |
          python - <<'PY'
          import importlib
          import sys

          # Measure what importing sailscoring *adds*, rather than inspecting the whole
          # of sys.modules: the interpreter has already loaded a handful of its
          # own modules before this runs, and they are not sailscoring's doing.
          before = set(sys.modules)
          sailscoring = importlib.import_module("sailscoring")
          added = set(sys.modules) - before

          assert "django" not in added, "importing sailscoring pulled in django"
          third_party = sorted(
              name for name in added
              if name.split(".")[0] not in sys.stdlib_module_names
              and name.split(".")[0] != "sailscoring"
          )
          assert not third_party, f"sailscoring pulled in third-party modules: {third_party}"
          print(
              f"sailscoring imported cleanly on {sys.version.split()[0]}: "
              f"{len(sailscoring.__all__)} public names, {len(added)} modules loaded, "
              f"all standard library"
          )
          PY

  manual:
    # The user manual builds as Read the Docs will build it. Strict mode fails
    # on a broken link or a page missing from mkdocs.yml's contents.
    name: user manual builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build the manual
        run: mkdocs build --strict
