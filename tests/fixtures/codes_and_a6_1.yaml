# Worked examples CODE-1 to CODE-6 for the scoring codes DSQ, RET, OCS and NSC,
# and RRS A6.1 (slice 26).
#
# SOURCE: docs/slices/26-more-scoring-codes-and-a6-1.md, "Worked examples".
# Worked by hand from the rules in that spec, not with the engine. The RRS
# publishes no worked example of A6.1, so these are the specification. The
# project owner checked them on 2026-10-10 and approved them as written. They
# are copied here as written. Never change an expected value to make a test
# pass: if the engine disagrees, the engine is wrong, or this file's provenance
# needs checking with the project owner first.
#
# Each example is a Portsmouth Yardstick race with every boat on 1000, so a
# boat's corrected time is her elapsed time and no handicap arithmetic is
# involved. Elapsed times are seconds (50:00 is 3000).
#
# A finish is written as one of:
#   - a number: FINISHED, with that elapsed time;
#   - a code on its own (DNC, DNS, DNF): no time;
#   - a mapping, for a DSQ, RET, OCS or NSC boat, with `status`, an optional
#     `elapsed` (the time she kept; omitted when she had none) and an optional
#     `penalty: true` for a scoring penalty.
# A boat with no finish recorded in a race is DNC (RRS A2.2).
#
# `expected` gives each boat's place and points. A boat with no `place` has no
# finishing place (her corrected time is None). `kept` is the elapsed time she
# keeps, where the spec shows one.
#
# Points come from RRS Appendix A: A4, A5.2 (or A5.3 where `apply_a5_3` is
# set), A7 for ties and the scoring penalty. Boats are entered 6 to a series
# unless the example says otherwise.

CODE-1:   # A6.1 under A5.2: B disqualified after finishing
  entries: 6
  apply_a5_3: false
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: as-sailed
      finishes: {A: 3000, B: 3060, C: 3120, D: 3180, E: 3240, F: DNC}
      expected:
        A: {place: 1, points: 1}
        B: {place: 2, points: 2}
        C: {place: 3, points: 3}
        D: {place: 4, points: 4}
        E: {place: 5, points: 5}
        F: {points: 7}
    - race_id: B-disqualified
      finishes:
        A: 3000
        B: {status: DSQ, elapsed: 3060}
        C: 3120
        D: 3180
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 7, kept: 3060}   # B keeps her recorded 51:00
        C: {place: 2, points: 2}
        D: {place: 3, points: 3}
        E: {place: 4, points: 4}
        F: {points: 7}

CODE-2:   # the same race under A5.3: five boats came to the starting area
  entries: 6
  apply_a5_3: true
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: B-disqualified
      finishes:
        A: 3000
        B: {status: DSQ, elapsed: 3060}
        C: 3120
        D: 3180
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 6, kept: 3060}   # 5 that came + 1 (A5.3)
        C: {place: 2, points: 2}
        D: {place: 3, points: 3}
        E: {place: 4, points: 4}
        F: {points: 7}               # did not come to the starting area

CODE-3:   # a tie, and B retires after finishing
  entries: 6
  apply_a5_3: false
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: B-retired
      finishes:
        A: 3000
        B: {status: RET, elapsed: 3060}
        C: 3120
        D: 3120
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 7, kept: 3060}
        C: {place: 2, points: 2.5}   # 2nd equal, (2 + 3) / 2
        D: {place: 2, points: 2.5}
        E: {place: 4, points: 4}
        F: {points: 7}

CODE-4:   # a scoring penalty on D, with and without B's disqualification
  entries: 6
  apply_a5_3: false
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: as-sailed
      finishes:
        A: 3000
        B: 3060
        C: 3120
        D: {status: FINISHED, elapsed: 3180, penalty: true}
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {place: 2, points: 2}
        C: {place: 3, points: 3}
        D: {place: 4, points: 5.4}   # 4 + 1.4 (20% of the DNF score, 7)
        E: {place: 5, points: 5}
        F: {points: 7}
    - race_id: B-disqualified
      finishes:
        A: 3000
        B: {status: DSQ, elapsed: 3060}
        C: 3120
        D: {status: FINISHED, elapsed: 3180, penalty: true}
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 7, kept: 3060}
        C: {place: 2, points: 2}
        D: {place: 3, points: 4.4}   # 3 + 1.4: worked on the place she ends with
        E: {place: 4, points: 4}
        F: {points: 7}

CODE-5:   # each code, with and without a time, under A5.2
  entries: 6
  apply_a5_3: false
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: each-code
      finishes:
        A: 3000
        B: {status: OCS, elapsed: 3060}
        C: {status: NSC, elapsed: 3120}
        D: RET
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 7, kept: 3060}
        C: {points: 7, kept: 3120}
        D: {points: 7}
        E: {place: 2, points: 2}
        F: {points: 7}

CODE-5 A5.3:   # the same race under A5.3
  entries: 6
  apply_a5_3: true
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: each-code
      finishes:
        A: 3000
        B: {status: OCS, elapsed: 3060}
        C: {status: NSC, elapsed: 3120}
        D: RET
        E: 3240
        F: DNC
      expected:
        A: {place: 1, points: 1}
        B: {points: 6, kept: 3060}
        C: {points: 6, kept: 3120}
        D: {points: 6}
        E: {place: 2, points: 2}
        F: {points: 7}

CODE-6:   # a series: A scores 1, 7 (DSQ) and 2
  # The spec gives A's three scores and F's DNC in every race, and not the
  # other boats' places. The places of B to E below are the arrangement used to
  # reach A's scores; the project owner is asked to check it with this fixture.
  entries: 6
  apply_a5_3: false
  discards: 0
  boats: {A: 1000, B: 1000, C: 1000, D: 1000, E: 1000, F: 1000}
  races:
    - race_id: R1
      finishes: {A: 3000, B: 3060, C: 3120, D: 3180, E: 3240, F: DNC}
      expected:
        A: {place: 1, points: 1}
    - race_id: R2
      finishes:
        A: {status: DSQ, elapsed: 3030}
        B: 3000
        C: 3060
        D: 3120
        E: 3180
        F: DNC
      expected:
        A: {points: 7, kept: 3030}
    - race_id: R3
      finishes: {A: 3060, B: 3000, C: 3120, D: 3180, E: 3240, F: DNC}
      expected:
        A: {place: 2, points: 2}
  standings:
    - {boat: A, total_no_discards: 10, total_one_discard: 3}
