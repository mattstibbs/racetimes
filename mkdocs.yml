# The user manual: for club members, the race committee and the
# administrator. Developer documentation is in docs/ and is not part of it.
site_name: RaceTimes user manual
docs_dir: manual
# Built into MkDocs, so no extra theme package is needed.
theme: readthedocs
# Plain CommonMark and tables only, so the pages also read properly on GitHub
# and would move to another tool unchanged.
markdown_extensions:
  - tables
  - toc:
      permalink: true
# A broken link or a page missing from the contents fails the build.
strict: true
validation:
  links:
    not_found: warn
    anchors: warn
  omitted_files: warn

nav:
  - Introduction: index.md
  - Getting started:
      - Finding your results: getting-started/finding-results.md
      - "Joining a club, and your data": getting-started/joining-a-club.md
      - Forgotten your password?: getting-started/forgotten-password.md
      - Changing your password: getting-started/changing-your-password.md
      - How results and handicaps are worked out: getting-started/how-results-are-worked-out.md
  - Members:
      - Emails you will receive: members/emails.md
  - Race committee:
      - The race office: committee/race-office.md
      - Setting up boats: committee/setting-up-boats.md
      - Setting up a series: committee/setting-up-a-series.md
      - "Race day: the start sheet and finishes": committee/race-day.md
      - Publishing results: committee/publishing-results.md
      - "A series' scoring rules": committee/scoring-rules.md
      - "Handicap systems: NHC, Portsmouth Yardstick and RYA YTC": committee/handicap-systems.md
      - "Running your club: members and roles": committee/members-and-roles.md
      - "Ending a series: final results": committee/ending-a-series.md
      - Reviewing waiting requests: committee/reviewing-requests.md
