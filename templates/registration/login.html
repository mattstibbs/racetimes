{% extends "base.html" %}
{% block title %}Log in - Race Times{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="stacked">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
<p class="muted">No account yet? <a href="{% url 'races:signup' %}">Sign up</a>.
  <a href="{% url 'races:password_reset' %}">Forgotten your password?</a></p>
{% endblock %}
