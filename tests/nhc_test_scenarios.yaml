#   SCEN-002 BOAT_WINNER      1.020 -> 1.03549433
#   SCEN-002 BOAT_MID_FLEET   1.000 -> 1.00194489
#   SCEN-002 BOAT_LOSER       0.980 -> 0.98128039
#   SCEN-004 BOAT_FINISHER    0.970 -> 0.95000000
#
# The clamp_max_increase / clamp_max_decrease keys in initial_state were removed
# for the same reason. The +/-10% of Base Number clamp in spec section 4 is a
# regatta-only rule and belongs with the regatta scenarios, which are not yet
# written.
#
# SCEN-001 and SCEN-003 were already correct and are unchanged apart from
# explicit status fields and added intermediate expectations. SCEN-005 and
# SCEN-006 are new, carrying the RYA's two published worked examples.
#
# Still not covered here, pending decisions: regatta adjustment (spec section
