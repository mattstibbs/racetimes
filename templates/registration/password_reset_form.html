{% extends "base.html" %}
{% block title %}Reset your password - Race Times{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p>Enter the email address you log in with, and we'll email you a link to choose a new password.</p>
<form method="post" class="stacked">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Email me a link</button>
</form>
{% endblock %}
