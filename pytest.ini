[pytest]
# Django integration. pytest-django needs the settings module up front; without
# it, importing anything from races/ fails before a test can run.
DJANGO_SETTINGS_MODULE = config.settings

# tests/ holds the scoring engine's tests; races/ and results/ each hold their
# own app's.
testpaths = tests races results

python_files = test_*.py tests.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    -ra
