# Worked examples SP-1 to SP-6 for the scoring penalty (slice 23, part B).
#
# SOURCE: docs/slices/23-discard-threshold-and-scoring-penalty.md, "Worked
# examples" (RRS 44.3(c) and A10 SCP, 2025-2028 edition). Worked by hand, not
# with the engine, re-worked when the spec was reviewed, and checked and
# approved by the project owner on 2026-10-02. They are copied here as written.
#
# A boat's `outcome` is FINISHED (with its `place`), DNF or DNC. `scp: true`
# is the scoring penalty. `points` is the score the examples work out.
# SP-4's other boats aren't given in the spec; only the two tied boats are
# checked, so the others are filler.

race_examples:
  SP-1:   # A5.2, six entered: a DNF scores 7, the penalty is 20% of 7 = 1.4
    entered: 6
    a5_3: false
    boats:
      A: {outcome: FINISHED, place: 1, points: 1}
      B: {outcome: FINISHED, place: 2, points: 2}
      C: {outcome: FINISHED, place: 3, scp: true, points: 4.4, penalty: 1.4}
      D: {outcome: FINISHED, place: 4, points: 4}
      E: {outcome: DNF, points: 7}
      F: {outcome: DNC, points: 7}
  SP-2:   # the same race under A5.3: five came, a DNF scores 6, penalty 1.2
    entered: 6
    a5_3: true
    boats:
      A: {outcome: FINISHED, place: 1, points: 1}
      B: {outcome: FINISHED, place: 2, points: 2}
      C: {outcome: FINISHED, place: 3, scp: true, points: 4.2, penalty: 1.2}
      D: {outcome: FINISHED, place: 4, points: 4}
      E: {outcome: DNF, points: 6}
      F: {outcome: DNC, points: 7}
  SP-3:   # the cap: 6 + 1.4 = 7.4 is worse than a DNF, so she scores 7
    entered: 6
    a5_3: false
    boats:
      A: {outcome: FINISHED, place: 1, points: 1}
      B: {outcome: FINISHED, place: 2, points: 2}
      C: {outcome: FINISHED, place: 3, points: 3}
      D: {outcome: FINISHED, place: 4, points: 4}
      E: {outcome: FINISHED, place: 5, points: 5}
      F: {outcome: FINISHED, place: 6, scp: true, points: 7, penalty: 1}
  SP-4:   # a tie for second: (2 + 3) / 2 = 2.5 each; one takes 1.4 more = 3.9
    entered: 6
    a5_3: false
    boats:
      A: {outcome: FINISHED, place: 1, points: 1}
      B: {outcome: FINISHED, place: 2, scp: true, points: 3.9, penalty: 1.4}
      C: {outcome: FINISHED, place: 2, points: 2.5}
      D: {outcome: FINISHED, place: 4, points: 4}
      E: {outcome: DNF, points: 7}
      F: {outcome: DNC, points: 7}

# SP-5: one boat's three race scores, 1, then a place of 3 that scored 4.4 with
# a scoring penalty, then 2.
series_example:
  SP-5:
    race_points: [1, 4.4, 2]
    totals: {0: 7.4, 1: 3}      # by number of discards

# SP-6: six boats entered, two races, no discards, A5.2. Everyone finishes both
# races; places and penalties per race, then the totals and final order.
tie_example:
  SP-6:
    entered: 6
    races:
      - {A: [1, true], B: [2, true], C: [3, false], D: [4, false], E: [5, false], F: [6, false]}
      - {A: [3, true], B: [2, true], C: [1, false], D: [4, false], E: [5, false], F: [6, false]}
    scores:
      A: [2.4, 4.4]
      B: [3.4, 3.4]
      C: [3, 1]
      D: [4, 4]
      E: [5, 5]
      F: [6, 6]
    totals: {A: 6.8, B: 6.8, C: 4, D: 8, E: 10, F: 12}
    order: [C, A, B, D, E, F]
