{% extends "base.html" %}
{% block content %}
<h1>Results</h1>
{% if series_list %}
<ul>
  {% for series in series_list %}
  <li><a href="{% url 'races:series_results' series.pk %}">{{ series.name }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">No series yet.</p>
{% endif %}
{% endblock %}
